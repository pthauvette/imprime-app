name: Order SLA alerts

# Tape /api/cron/order-sla-alerts quotidien 10h UTC.
# Scan les orders PAID/SUBMITTED depuis > 48h et email admin.
# Security: pas d'untrusted input. CRON_SECRET via env per safe pattern.

on:
  schedule:
    # Round 38 #5 — Shift de 10h UTC vers 13h UTC = 9h EDT / 8h EST.
    # Aligné avec daily-summary + weekly-digest pour batch de 1ère lecture.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/order-sla-alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://plio.ca/api/cron/order-sla-alerts
