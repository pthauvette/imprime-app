name: Refresh product prices (prix « à partir de »)

# Tape /api/cron/refresh-product-prices toutes les heures. Rafraîchit la table
# ProductStartingPrice (prix minimal par produit, markup inclus) par tranches
# de ~40 produits sous budget de temps — le catalogue complet (~178) converge
# en ~5 h. Alimente le « À partir de X $ » des listes /order/product.
#
# ⚠️ TOUJOURS viser www.plio.ca, JAMAIS l'apex : l'apex répond 404 sur
# /api/cron/* (redirecteur GoDaddy) — cf. Round 45 #4 + sweep 2026-07-07.
#
# Security: pas d'untrusted input (no github.event.* used). Only the pinned
# CRON_SECRET (repo secret) via env per safe pattern.

on:
  schedule:
    - cron: '35 * * * *'  # toutes les heures à :35 (offset des autres crons)
  workflow_dispatch:

concurrency:
  group: refresh-product-prices
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/refresh-product-prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant."
            exit 1
          fi
          response=$(curl -fsS --show-error \
            --max-time 120 \
            -X GET https://www.plio.ca/api/cron/refresh-product-prices \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "$response" | jq .
          computed=$(echo "$response" | jq -r '.computed // 0')
          failed=$(echo "$response" | jq -r '.failed // 0')
          remaining=$(echo "$response" | jq -r '.remaining // 0')
          echo "::notice::$computed prix recalculé(s), $remaining restant(s) dans la file"
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed produit(s) en échec — retentés au prochain run (voir /admin/crons)"
          fi
