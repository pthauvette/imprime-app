name: Purge old OrderEvents

# Tape /api/cron/purge-old-events le 1er du mois à 9h UTC.
# Supprime OrderEvent rows pour Orders > 2 ans + status terminal
# (DELIVERED/CANCELLED/FAILED). On garde l'Order row (audit fiscal).
# PIPEDA principe 5 (retention).
#
# Security: pas d'untrusted input (no github.event.* used). Only the
# pinned CRON_SECRET via env per safe pattern.

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/purge-old-events
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://plio.ca/api/cron/purge-old-events
