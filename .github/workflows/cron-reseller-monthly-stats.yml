name: Reseller monthly stats email

# Tape /api/cron/reseller-monthly-stats le 1er du mois à 08h UTC
# (après reseller-detection à 07h, après que le status soit a jour pour
# le mois). Compute stats du mois ecoule + envoie un recap email aux
# resellers VERIFIED/AUTO_DETECTED qui ont eu au moins 1 order.
#
# Security: pas d'untrusted input (no github.event.* used). Only the
# pinned CRON_SECRET (a stable repo secret) via env var per safe pattern.

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /api/cron/reseller-monthly-stats
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant."
            exit 1
          fi
          # ⚠️ TOUJOURS viser www.plio.ca, JAMAIS l'apex : l'apex répond 404 sur
          # /api/cron/* (redirecteur GoDaddy) → chaque run échouait (Round 45 #4,
          # sweep complété 2026-07-07 — 12 crons étaient morts en silence).
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.plio.ca/api/cron/reseller-monthly-stats
