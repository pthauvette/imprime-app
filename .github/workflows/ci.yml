name: CI (typecheck + unit tests)

# Gate sur chaque PR vers main : prisma generate → typecheck → vitest.
# Pas de DB requise — les tests vitest mock prisma. Pas de browser non
# plus — Playwright e2e a son propre workflow .github/workflows/e2e.yml
# qui tape la prod après deploy.

on:
  pull_request:
    branches: [main]
    # PAS de paths-ignore ici : le check "Typecheck + Vitest" est REQUIS par la
    # branch protection. Si on ignore des paths, un PR ne touchant QUE ces paths
    # (ex: docs/*.md, public/*) ne déclenche pas le workflow → le required check
    # reste "pending" éternellement → merge BLOQUÉ (deadlock paths-ignore +
    # required check). On laisse donc le gate tourner sur tous les PR. Un PR
    # docs-only paie ~3 min de CI — acceptable vs un merge impossible.
  # On run aussi sur push main pour avoir l'état "main is green" visible
  # dans le badge GitHub. concurrency group cancel-in-progress évite les
  # builds doublons quand on push plusieurs commits rapprochés.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'public/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup exige une version explicite : pas de champ
      # `packageManager` dans package.json, donc on l'épingle ici. Même
      # valeur que e2e.yml / e2e-nightly.yml (10.33.2) pour rester aligné.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client doit être généré sinon les imports `@prisma/client`
      # échouent à la compilation. DB pas needed — c'est offline.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      # Garde de non-régression ciblée : aucune promesse flottante (`void asyncFn`,
      # `.then` non-awaité, IIFE async fire-and-forget) dans le code SERVEUR —
      # elle GÈLE sur Amplify/Lambda après la réponse (leçon #322-324). Scopée à
      # src/app/api + src/lib (le client est exclu : le navigateur ne gèle pas).
      # Blast radius mesuré = 0 → ce step ne bloque que les régressions futures.
      - name: Lint — promesses flottantes serveur (anti gel Lambda)
        run: pnpm lint:no-floating

      - name: Unit tests (Vitest)
        run: pnpm vitest run

      # Build sanity : `next build` attrape des erreurs que tsc ne voit pas
      # (frontières server/client, config de routes, Suspense manquant…).
      # En dernier car ~3 min : tsc + vitest échouent vite si c'est cassé.
      # env.ts ne throw pas (fix Round 42b) et instrumentation.ts catch
      # assertProductionEnvReady → le build ne plante pas sur env manquant.
      - name: Build sanity
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://www.plio.ca
          # Stubs build-only de sécurité. Prisma est lazy (connexion à la 1re
          # query) et NextAuth résout son secret par requête, mais on fournit
          # DATABASE_URL / AUTH_SECRET en filet pour ne pas dépendre d'un
          # comportement lazy non garanti à la collecte de page data.
          # NB : plus de stub SINALITE_* ni STRIPE_SECRET_KEY — lib/sinalite/client.ts
          # (getEnv()) et lib/stripe/client.ts (getStripe()) résolvent leur
          # config de façon paresseuse depuis Round 45, donc ils ne throw plus
          # au chargement du module.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_stub
          AUTH_SECRET: ci-build-stub-secret-min-32-chars-long-xxxx
