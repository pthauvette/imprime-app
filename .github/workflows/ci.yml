name: CI (typecheck + unit tests)

# Gate sur chaque PR vers main : prisma generate → typecheck → vitest.
# Pas de DB requise — les tests vitest mock prisma. Pas de browser non
# plus — Playwright e2e a son propre workflow .github/workflows/e2e.yml
# qui tape la prod après deploy.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'public/**'
  # On run aussi sur push main pour avoir l'état "main is green" visible
  # dans le badge GitHub. concurrency group cancel-in-progress évite les
  # builds doublons quand on push plusieurs commits rapprochés.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'public/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup exige une version explicite : pas de champ
      # `packageManager` dans package.json, donc on l'épingle ici. Même
      # valeur que e2e.yml / e2e-nightly.yml (10.33.2) pour rester aligné.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client doit être généré sinon les imports `@prisma/client`
      # échouent à la compilation. DB pas needed — c'est offline.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm vitest run

      # Build sanity : `next build` attrape des erreurs que tsc ne voit pas
      # (frontières server/client, config de routes, Suspense manquant…).
      # En dernier car ~3 min : tsc + vitest échouent vite si c'est cassé.
      # env.ts ne throw pas (fix Round 42b) et instrumentation.ts catch
      # assertProductionEnvReady → le build ne plante pas sur env manquant.
      - name: Build sanity
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://www.plio.ca
          # Stubs build-only. Certains modules valident/instancient AU CHARGEMENT
          # et throw si l'env manque, ce qui casse `next build` à la collecte de
          # page data des routes qui les importent. Le build n'exécute aucune
          # route (toutes dynamiques) ni n'appelle ces services — ces valeurs
          # factices servent juste à laisser les modules se charger :
          #   - lib/sinalite/client.ts : z.object().parse() des creds (throw).
          #   - routes stripe : `new Stripe(STRIPE_SECRET_KEY!)` top-level (throw
          #     si falsy). Les variantes wallet/health sont gardées par ternaire.
          #   - DATABASE_URL / AUTH_SECRET : Prisma est lazy et NextAuth résout le
          #     secret par requête, mais on les fournit par sécurité (filet).
          SINALITE_CLIENT_ID: ci-build-stub
          SINALITE_CLIENT_SECRET: ci-build-stub
          STRIPE_SECRET_KEY: sk_test_ci_build_stub
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_stub
          AUTH_SECRET: ci-build-stub-secret-min-32-chars-long-xxxx
