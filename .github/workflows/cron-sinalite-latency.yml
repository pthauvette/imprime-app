name: Sinalite latency monitor

# Tape /api/cron/sinalite-latency toutes les 15 minutes.
# Probe auth + product GET, record latency dans CronRun.
# Alert Slack si P95 sur dernière heure > 3s (4 runs consécutifs en
# dégradation, pas un single spike).
#
# Security: pas d'untrusted input (no github.event.* used). Only the
# pinned CRON_SECRET via env per safe pattern.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/sinalite-latency
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://plio.ca/api/cron/sinalite-latency
