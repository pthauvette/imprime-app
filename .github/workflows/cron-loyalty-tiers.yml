name: Loyalty tier monthly recompute

# Tape /api/cron/loyalty-tiers le 1er du mois à 05h00 UTC.
# Recompute le tier basé sur revenu 365j → upgrade / downgrade.

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /api/cron/loyalty-tiers
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://plio.ca/api/cron/loyalty-tiers
