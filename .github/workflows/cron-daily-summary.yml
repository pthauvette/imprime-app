name: Daily summary email

# Envoie le récap quotidien aux ADMIN_EMAILS via /api/cron/daily-summary.
# Mêmes secret (CRON_SECRET) et workflow pattern que cron-cleanup.yml.
#
# Round 38 #5 — Shift de 11h UTC vers 13h UTC = 9h EDT été / 8h EST hiver.
# Avant : 7h ET en été, 6h ET en hiver — souvent avant que l'admin
# soit éveillé/à son ordinateur, le récap se perdait dans la pile.
# Maintenant : 8-9h ET année-ronde, fenêtre "1ère consultation du matin".
# Bouton "Run workflow" dispo pour test manuel ou re-send.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/cron/daily-summary
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant. Ajoute-le dans Settings → Secrets → Actions."
            exit 1
          fi
          # On tape www directement (le 301 apex→www GoDaddy mange le path).
          response=$(curl -fsS --show-error \
            --max-time 90 \
            -X GET https://www.plio.ca/api/cron/daily-summary \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "$response" | jq .
          # Vérifier qu'au moins UN destinataire a reçu (sent=true)
          all_failed=$(echo "$response" | jq '[.recipients[].sent] | all(. == false)')
          if [ "$all_failed" = "true" ]; then
            echo "::error::Aucun destinataire n'a reçu — voir le body pour les erreurs SES par email."
            exit 1
          fi
