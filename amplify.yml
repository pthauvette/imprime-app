version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Active pnpm via Corepack — Amplify n'a pas pnpm par défaut.
            - corepack enable
            - corepack prepare pnpm@10.33.2 --activate
            - pnpm install --frozen-lockfile
            # Génère le client Prisma (sinon next build échoue à l'import).
            - pnpm exec prisma generate
            # Applique les migrations — idempotent. Utilise DIRECT_URL (port 5432),
            # pas le pooler : Supavisor en mode transaction ne supporte pas les
            # verrous de session dont `migrate deploy` a besoin.
            #
            # ── SOUPAPE D'URGENCE : SKIP_MIGRATIONS ──────────────────────────
            # Le couplage migrations↔build protège une vraie propriété : on ne
            # déploie jamais du code qui attend un schéma inexistant. On le GARDE.
            #
            # Mais il a un défaut vécu (Neon mort, 2026-07) : une base injoignable
            # gèle TOUT déploiement, y compris un correctif sans aucun rapport
            # avec la DB. On se retrouve incapable de livrer le fix pendant que la
            # prod brûle.
            #
            # `SKIP_MIGRATIONS=1` (posée dans la console Amplify, RETIRÉE juste
            # après) saute l'étape pour ce build. C'est une soupape, pas un mode :
            # elle exige un geste manuel, elle crie dans le log, et un déploiement
            # normal ne peut pas l'emprunter par inadvertance.
            #
            # ⚠️ Après usage : RETIRER la variable et redéployer, sinon les
            # migrations suivantes ne s'appliqueront jamais et le schéma dérivera
            # en silence — un mode d'échec pire que celui qu'on contourne.
            - |
              set -euo pipefail
              if [ "${SKIP_MIGRATIONS:-}" = "1" ]; then
                echo "::warning::SKIP_MIGRATIONS=1 — migrations NON appliquées pour ce build."
                echo "::warning::Soupape d'urgence. RETIRER la variable et redéployer dès que la DB répond."
              else
                pnpm exec prisma migrate deploy
              fi
        build:
          commands:
            # Amplify Console expose les env vars au BUILD mais pas toujours
            # au RUNTIME des Server Components (Lambda SSR). Workaround : on
            # écrit toutes les vars qui nous intéressent dans .env.production
            # — Next.js les charge à `next start` automatiquement.
            # Whitelist explicite pour ne pas leak AWS_* internal vars.
            #
            # BUG FIX (incident prod 2026-05-30, site-wide 500) : la regex
            # finissait par '='. Comme la liste est surtout des PRÉFIXES
            # (AUTH_/STRIPE_/SINALITE_/SES_/CRON_...), '^AUTH_=' exigeait une
            # var nommée exactement 'AUTH_' suivie de '=' — inexistant. Seul
            # DATABASE_URL (nom complet) matchait → .env.production ne contenait
            # qu'UNE var au runtime → AUTH_SECRET undefined → boot crash → 500
            # partout. Retrait du '=' final → les préfixes matchent (repro :
            # 1/7 vars avant, 7/7 après). '>' (pas '>>') pour ne pas accumuler.
            # MCP_ ajouté (2026-06) : les flags/secrets du serveur MCP (MCP_OAUTH*,
            # MCP_CREATE_ORDER_PAY) sont lus au RUNTIME Lambda SSR. Sans le préfixe
            # ici, ils étaient posés dans la Console Amplify mais JAMAIS écrits dans
            # .env.production → undefined au runtime (symptôme : route OAuth PRM en 404
            # alors que la var existait côté Console). Tout nouveau préfixe d'env lu au
            # runtime DOIT être ajouté à cette whitelist.
            # AWS_COMMIT_ID (2026-06) : SEULE var AWS_ incluse, par son NOM EXACT
            # (jamais le préfixe AWS_, pour ne pas leak les creds AWS internes —
            # AWS_ACCESS_KEY_ID, etc.). C'est le SHA git du commit buildé, qu'Amplify
            # pose à l'env de build ; on l'expose au runtime pour /api/health
            # (releaseId), socle de la sonde deploy-drift (« merged ≠ deployed »).
            # Sans elle, releaseId tombe sur 'dev' et le drift est indétectable.
            # 2026-07-20 (rév. 2) — écriture de .env.production, DURCIE.
            #
            # Historique : on écrivait `CLE=valeur` BRUT. Un `#` dans un mot de
            # passe faisait passer la suite en commentaire (dotenv) → DATABASE_URL
            # tronquée → « invalid port number » en prod. La 1re correction
            # (guillemets DOUBLES + échappement de `\` et `"`) ne réglait que le
            # `#` : mesuré 3/7 sur des mots de passe réalistes.
            #
            # Version actuelle : guillemets SIMPLES + échappement de `$`.
            # Mesuré 7/7 (test tests/amplify-env-quoting.test.ts, rejoué contre
            # le VRAI loader @next/env, qui applique dotenv-expand) :
            #   pa#ss · pa$ss · pa"ss · pa\ss · pa ss · p@s$w#rd\x · simple123
            # Le `$` est le cas le plus vicieux : non échappé, dotenv-expand le
            # traite comme une référence de variable et l'avale SILENCIEUSEMENT,
            # produisant une URL syntaxiquement VALIDE → erreur d'authentification
            # opaque au lieu d'un message clair. Pire que le `#`.
            #
            # NON couvert : une valeur contenant `'` ou un saut de ligne. Les
            # assertions ci-dessous font échouer le build dans ce cas (un build
            # rouge explicite vaut mieux qu'un runtime corrompu).
            #
            # ⚠️ `|| true` RETIRÉ : il avalait exactement le mode de panne de
            # l'incident 2026-05-30 (grep qui ne matche rien → .env.production
            # vide → AUTH_SECRET undefined → 500 partout, en silence).
            - |
              set -euo pipefail
              env | grep -E '^(DATABASE_URL|DIRECT_URL|AUTH_|ADMIN_|SINALITE_|STRIPE_|NEXT_PUBLIC_|SES_|S3_|SENTRY_|UPSTASH_|CRON_|SLACK_|COMPANY_|APPLE_PAY_|CANADA_POST_|MCP_|ENFORCE_|FILE_REVALIDATION|ORDER_|REFERRAL_|GOLD_|DEFAULT_MARGIN_PCT|ARTWORK_URL_MODE|SKIP_MIGRATIONS|AWS_COMMIT_ID|TWILIO_|SMS_AUTH)' \
                | sed -E "s/\\\$/\\\\\$/g; s/^([A-Za-z_][A-Za-z0-9_]*)=(.*)\$/\\1='\\2'/" \
                > .env.production
              n=$(grep -c '^[A-Za-z_]' .env.production || true)
              [ "$n" -ge 15 ] || { echo "::error::.env.production ne contient que $n vars (attendu >=15) — whitelist ou grep cassé"; exit 1; }
              for k in DATABASE_URL AUTH_SECRET STRIPE_SECRET_KEY CRON_SECRET; do
                grep -q "^$k=" .env.production || { echo "::error::$k absent de .env.production"; exit 1; }
              done
              node -e '
                const fs=require("fs");
                const m=fs.readFileSync(".env.production","utf8").match(/^DATABASE_URL='"'"'(.*)'"'"'$/m);
                if(!m){throw new Error("DATABASE_URL introuvable ou mal quotée");}
                const u=new URL(m[1]);
                if(!u.port){throw new Error("DATABASE_URL sans port — valeur tronquée ?");}
                console.log("env OK : DATABASE_URL port "+u.port+", "+process.argv[1]);
              ' "$n vars"
            # OOM FIX (build gelé 2026-06) : `next build` dépassait la heap Node
            # par défaut (~2 Go) et mourait en `JavaScript heap out of memory`
            # (exit 134) — l'app a grossi (MCP, mcp-handler, pages). C'est ce qui
            # gelait la prod (build rouge → pas de déploiement) alors que la CI
            # passait (la CI ne reproduit pas le pic mémoire de prod).
            #
            # 2026-07-15 — 4096 → 6144 : la prod est restée gelée sur ce8286d
            # alors que main était à 57ec76e (#452) ; la sonde deploy-drift a
            # échoué (« merged ≠ deployed », 33 min de poll). Même signature que
            # 2026-06 : CI verte + build local OK, mais aucun déploiement. L'app
            # a encore grossi depuis (12 → 13 produits virtuels, 3 tools MCP,
            # table prix). ⚠️ HYPOTHÈSE non confirmée par le log Amplify (pas
            # d'accès console) — si le build reste rouge APRÈS ce bump, lire le
            # log : « heap out of memory » (exit 134) = la heap est encore trop
            # petite MAIS le conteneur suffit ; « Killed » / exit 137 = c'est le
            # CONTENEUR qui est trop petit → passer la compute en « Large »
            # (Console Amplify → App settings → Build settings), le NODE_OPTIONS
            # n'y changera rien.
            # 2026-07-20 (rév. 2) — 6144 → 3072. Le bump à 6144 était
            # CONTRE-PRODUCTIF : sur un conteneur « Standard » de 4 Go, dire à V8
            # qu'il peut monter à 6 Go le fait dépasser la limite du cgroup et se
            # faire TUER PAR LE NOYAU (SIGKILL / exit 137) au lieu de lever un
            # « JavaScript heap out of memory » (exit 134), qui serait
            # diagnosticable. On rend donc la panne LISIBLE.
            # Pic RSS mesuré du build : ~3,18 Gio → 3072 laisse V8 faire son GC
            # sous le plafond conteneur.
            # ⚠️ Marge réelle ~20 % seulement. Le prochain dépassement ne se
            #    règlera PAS dans ce fichier : les leviers de next.config.ts sont
            #    épuisés (webpackMemoryOptimizations + lint off + typecheck off).
            #    → passer le build compute en « Large » (8 Go) dans la Console
            #      Amplify, PUIS remonter cette valeur à 6144.
            - NODE_OPTIONS='--max-old-space-size=3072' pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - ~/.pnpm-store/**/*
