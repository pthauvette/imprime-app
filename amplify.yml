version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Active pnpm via Corepack — Amplify n'a pas pnpm par défaut.
            - corepack enable
            - corepack prepare pnpm@10.33.2 --activate
            - pnpm install --frozen-lockfile
            # Génère le client Prisma (sinon next build échoue à l'import).
            - pnpm exec prisma generate
            # Apply les migrations DB (Neon Postgres) — idempotent.
            - pnpm exec prisma migrate deploy
        build:
          commands:
            # Amplify Console expose les env vars au BUILD mais pas toujours
            # au RUNTIME des Server Components (Lambda SSR). Workaround : on
            # écrit toutes les vars qui nous intéressent dans .env.production
            # — Next.js les charge à `next start` automatiquement.
            # Whitelist explicite pour ne pas leak AWS_* internal vars.
            #
            # BUG FIX (incident prod 2026-05-30, site-wide 500) : la regex
            # finissait par '='. Comme la liste est surtout des PRÉFIXES
            # (AUTH_/STRIPE_/SINALITE_/SES_/CRON_...), '^AUTH_=' exigeait une
            # var nommée exactement 'AUTH_' suivie de '=' — inexistant. Seul
            # DATABASE_URL (nom complet) matchait → .env.production ne contenait
            # qu'UNE var au runtime → AUTH_SECRET undefined → boot crash → 500
            # partout. Retrait du '=' final → les préfixes matchent (repro :
            # 1/7 vars avant, 7/7 après). '>' (pas '>>') pour ne pas accumuler.
            # MCP_ ajouté (2026-06) : les flags/secrets du serveur MCP (MCP_OAUTH*,
            # MCP_CREATE_ORDER_PAY) sont lus au RUNTIME Lambda SSR. Sans le préfixe
            # ici, ils étaient posés dans la Console Amplify mais JAMAIS écrits dans
            # .env.production → undefined au runtime (symptôme : route OAuth PRM en 404
            # alors que la var existait côté Console). Tout nouveau préfixe d'env lu au
            # runtime DOIT être ajouté à cette whitelist.
            # AWS_COMMIT_ID (2026-06) : SEULE var AWS_ incluse, par son NOM EXACT
            # (jamais le préfixe AWS_, pour ne pas leak les creds AWS internes —
            # AWS_ACCESS_KEY_ID, etc.). C'est le SHA git du commit buildé, qu'Amplify
            # pose à l'env de build ; on l'expose au runtime pour /api/health
            # (releaseId), socle de la sonde deploy-drift (« merged ≠ deployed »).
            # Sans elle, releaseId tombe sur 'dev' et le drift est indétectable.
            # 2026-07-20 — valeurs ENTRE GUILLEMETS. Avant, on écrivait
            # `CLE=valeur` brut : toute valeur contenant un `#` voyait la suite
            # traitée comme un COMMENTAIRE par le parseur dotenv (URL tronquée
            # → « invalid port number »), et une valeur avec espaces cassait
            # aussi. Les mots de passe Supabase/Stripe peuvent contenir `#`.
            # sed entoure la valeur de guillemets doubles (on échappe d'abord
            # les `"` et `\` éventuels pour ne pas casser le quoting).
            - >-
              env | grep -E '^(DATABASE_URL|AUTH_|ADMIN_|SINALITE_|STRIPE_|NEXT_PUBLIC_|SES_|S3_|SENTRY_|UPSTASH_|CRON_|SLACK_|COMPANY_|APPLE_PAY_|CANADA_POST_|MCP_|AWS_COMMIT_ID)'
              | sed -E 's/\\/\\\\/g; s/"/\\"/g; s/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/\1="\2"/'
              > .env.production || true
            # OOM FIX (build gelé 2026-06) : `next build` dépassait la heap Node
            # par défaut (~2 Go) et mourait en `JavaScript heap out of memory`
            # (exit 134) — l'app a grossi (MCP, mcp-handler, pages). C'est ce qui
            # gelait la prod (build rouge → pas de déploiement) alors que la CI
            # passait (la CI ne reproduit pas le pic mémoire de prod).
            #
            # 2026-07-15 — 4096 → 6144 : la prod est restée gelée sur ce8286d
            # alors que main était à 57ec76e (#452) ; la sonde deploy-drift a
            # échoué (« merged ≠ deployed », 33 min de poll). Même signature que
            # 2026-06 : CI verte + build local OK, mais aucun déploiement. L'app
            # a encore grossi depuis (12 → 13 produits virtuels, 3 tools MCP,
            # table prix). ⚠️ HYPOTHÈSE non confirmée par le log Amplify (pas
            # d'accès console) — si le build reste rouge APRÈS ce bump, lire le
            # log : « heap out of memory » (exit 134) = la heap est encore trop
            # petite MAIS le conteneur suffit ; « Killed » / exit 137 = c'est le
            # CONTENEUR qui est trop petit → passer la compute en « Large »
            # (Console Amplify → App settings → Build settings), le NODE_OPTIONS
            # n'y changera rien.
            - NODE_OPTIONS='--max-old-space-size=6144' pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - ~/.pnpm-store/**/*
